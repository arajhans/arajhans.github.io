tagline: >
  Technical computing, model-based design, and AI-enabled cyber-physical systems,
  with a focus on research programs that connect academic work to industrial practice.

home_intro: >
  Akshay Rajhans leads the MathWorks Advanced Research & Technology Office and works
  at the intersection of technical computing, model-based design, AI-enabled
  cyber-physical systems, and research programs that connect academic work to
  industrial practice.

summary:
  - >
    Akshay Rajhans leads the MathWorks Advanced Research & Technology Office, which
    owns several research and technology innovation programs including MathWorks
    Research Summits, research collaborations, challenge projects, Research Office
    Projects, and the patent program.
  - >
    His background centers on technical computing and model-based design, often in
    the application context of intelligent cyber-physical systems, formal methods,
    autonomy, and engineering tooling.
  - >
    He holds a Ph.D. in Electrical and Computer Engineering from Carnegie Mellon
    University and an M.S. in Electrical Engineering from the University of
    Pennsylvania. Earlier in his career, he worked on electronic control systems at
    Cummins and co-invented a model-based approach to non-intrusive load monitoring
    during a research internship at Bosch.

focus_areas:
  - Cyber-Physical Systems
  - Formal Methods and Verification
  - Modeling and Simulation
  - AI in Engineering Tooling
