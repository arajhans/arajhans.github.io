# Venue SERIES — the recurring conference, journal or workshop, not one instance of it.
#
# WHY THIS IS SEPARATE FROM `venue:`
# A publication's `venue:` string is prose about one instance: "21st ACM International
# Conference on Hybrid Systems: Computation and Control (HSCC)", or "Frontiers in
# Analog Circuit Synthesis and Verification (FAC), co-located with Computer-Aided
# Verification (CAV), Snowbird, UT". That ordinal, that co-location and that city are
# worth printing and are different every time, which is exactly why the string cannot
# also be the filter key. "Show me all HSCC papers" needs something stable, so
# entries carry `series: hscc` next to the prose, the same way they carry `topics:`
# next to the title.
#
# WHY IT IS SHARED WITH service.yml
# The reason a venue facet is worth the trouble is that a venue relationship is not
# only authorship. HSCC here is one paper, an Awards Chair term, a Demo and Poster
# Chair term and a PC seat — four entries across two data files that no page could
# previously connect. WinterSim and SpringSim are each a paper plus a track chair
# plus a PC seat. One vocabulary, both files, so those add up instead of splitting
# into "the paper list's HSCC" and "the service list's HSCC".
#
# `series:` IS OPTIONAL, AND THAT IS NOT AN OVERSIGHT
# Three publications have no series and should not be given one: a paper still under
# review has no venue yet, and the NSF and NIST workshop reports are one-off events,
# not editions of anything. Inventing a slug for a thing that happened once would put
# a permanent single-entry checkbox in the nav. An entry without `series:` simply
# drops out when a venue is selected, which is the correct answer to "show me all
# HSCC papers".
#
# Fields:
#   slug     stable key used by `series:` in publications.yml and service.yml
#   name     full name, shown as the option's tooltip
#   acronym  what the nav shows; omitted when the name IS the short form
#   kind     conference | journal | workshop | seminar | event
#
# scripts/check_data.py rejects a `series:` that is not declared here, and warns about
# a venue declared here that nothing uses.

- slug: hscc
  name: 'ACM International Conference on Hybrid Systems: Computation and Control'
  acronym: HSCC
  kind: conference

