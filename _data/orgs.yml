# External collaborator institutions — controlled vocabulary.
#
# Transcribed from the `\with{...}` annotations in the CV's publications.tex.
# That macro is `\newcommand{\with}[1]{\textcolor{color2}{[with \textbf{#1}]}}` —
# i.e. the institution list lives inside a *formatting* command, as one
# comma-delimited string. Three consequences that this file fixes:
#
#   1. "Decyphir, Inc." contains the delimiter. Any naive comma split turns one
#      company into "Decyphir" and "Inc.". A list cannot have that bug.
#   2. Three entries gave up and wrote prose instead of names: "more than a dozen
#      coauthor affiliations" (x2) and "several dozen coauthor affiliations". Those
#      affiliations are simply not recorded anywhere and are not invented here.
#   3. "University of Rome" is ambiguous — Sapienza, Tor Vergata and Roma Tre are
#      all "University of Rome". Flagged below rather than guessed.
#
# `kind` is what makes "industry collaborations" and "academic collaborations"
# answerable without a second tag: academic | industry | lab | nonprofit.
#
# Deliberately NOT stored here: country. Guessing 31 countries invites exactly the
# kind of plausible-but-unverified fact this project already got burned by once.
# The right fix is a ROR ID (ror.org) per institution — the ORCID equivalent for
# organisations — which carries country, aliases and a stable identifier so
# "University of Bergamo" cannot drift into "Univ. of Bergamo". Add `ror:` when
# looked up; the gate will accept it.
#
# There is no `external: true` flag anywhere, on purpose. See publications.yml.

  - slug: bergamo
    name: University of Bergamo
    kind: academic
