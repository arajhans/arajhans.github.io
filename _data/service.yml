# Professional service — single source of truth.
#
# Built as the UNION of index.md and service.md, not a copy of either. Both had
# content the other lacked: index.md alone had the ACM SIGBED board seat and the WPI
# dates; service.md alone had the EGO Insider's Guide editorship, CITest_CPS, the
# featured interviews, all student mentoring, teaching and outreach, and most URLs.
#
# Date convention, deliberately explicit so the "2020-2022 vs 2020-23" class of
# drift cannot recur:
#   start: <year> | unknown            required
#   end:   <year> | ongoing | unknown  required; `ongoing` renders as an open range
# A single-year item has end equal to start.
#
# `unknown` means NEITHER source recorded a date and it has not been invented. Nine
# entries carry it today: eight PC memberships (ICCPS, HSCC, AnnSim, SummerSim,
# WinterSim, FM, MPM4CPS, ICINCO) and the Springer book editorial board. The old
# index.md PC list was entirely undated and service.md dated only some, so these are
# genuinely missing facts rather than a migration bug — fill them in when known.
# Renderers must omit the range for `unknown` rather than printing a placeholder.
#
# Links are a LIST, never a single `url:`. One URL per entry cannot express "the
# announcement" and "the artifact" as different things - the MIT report is exactly
# that case, where the /2024/05/16/ page is a news post about a PDF hosted elsewhere.
# Each link carries its own label so a reader knows what they are about to open,
# including when it is a 17 MB download. The same shape carries over to publications,
# where pdf / doi / slides / video are all distinct destinations.
#
#   links:
#     - {label: 'Report (PDF, 17 MB)', url: 'https://...'}
#     - {label: Announcement, url: 'https://...'}
#
# `topics:` is validated against _data/topics.yml by scripts/check_data.py.
# Membership is many-to-many on purpose: HSCC is a CPS venue *and* a formal
# verification venue *and* a control venue, which is exactly what the old
# single-parent nested list could not express.

# The file declares its own contract; scripts/check_data.py enforces exactly this.
# Publications declare a different one (title/authors/venue/year), which is why the
# gate reads it from here rather than hard-coding one shape for every data file.
required: [category, what, start, end, topics]

categories:
  - slug: government
    name: Invited Expert for Government Agencies
  - slug: advisory
    name: Industry Advisory Boards and Committees
  - slug: editorial
    name: Editorial Work
  - slug: chair
    name: Conference Leadership
  - slug: pc
    name: Program Committee Membership
  - slug: interview
    name: Featured Interviews, Perspectives, and Quotes
  - slug: mentoring
    name: Student Mentoring
  - slug: teaching
    name: Teaching
  - slug: competition
    name: Student Competitions
  - slug: outreach
    name: STEM Outreach

