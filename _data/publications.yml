# PARTIAL SEED - 17 of roughly 45 publications. Read this header before using it.
#
# This file exists to exercise and prove the three new facets (orgs, distinctions,
# mentored) against real data. It is deliberately NOT the full publication list:
# transcribing all of publications.tex before the entry shape is agreed would mean
# doing it twice. The 17 chosen are all of the Visioning Work section plus every
# technical paper carrying an external affiliation, a distinction, or a mentored
# coauthor - the ones that test something.
#
# Everything here is transcribed from AkshayRajhansCV_v11_AR/publications.tex. No
# titles, venues, years or author lists are inferred.
#
# ---------------------------------------------------------------------------
# THREE FACETS, NOT ONE TAG LIST
#
# `topics:`        what the work is about        (_data/topics.yml)
# `orgs:`          external collaborator institutions   (_data/orgs.yml)
# `distinctions:`  awards and honours           (_data/distinctions.yml)
#
# These are separate fields on purpose. Collapsing them into one namespace would
# make `mcmaster`, `best-paper` and `cps` indistinguishable, so "show me McMaster
# papers" and "show me award papers" would become the same query. Separate facets
# also mean they compose: external AND best-paper AND formal-methods.
#
# ---------------------------------------------------------------------------
# TWO THINGS ARE DERIVED, NEVER STORED
#
# "Externally coauthored" is `orgs` being non-empty. There is no `external: true`
# flag, because external is relative to where I was at the time, and that changed:
# Penn, then CMU, then MathWorks. A CMU coauthor is external in 2025 and was
# internal in 2013. A stored boolean would be wrong for half the list the moment
# it was written; a derivation is right forever. The CV already gets this right by
# only annotating when the coauthor is external.
#
# Affiliation is also per-paper, not per-person, for the same reason. Claudio
# Menghi is on P(2024) as McMaster University and on P(2025) as University of
# Bergamo. He moved. A single people-registry field would have to be wrong about
# one of the two papers, so `orgs` is recorded on the publication.
#
# And one author can carry more than one affiliation on a single paper, so `orgs`
# is a UNION over authors, never one entry per author. Menghi is Bergamo *and*
# McMaster on both the FSE 2025 and TSE 2024 papers; Fujita is Tokyo Tech and
# U. Tokyo, and Bauer is three institutions, on the CSM 2024 paper. The CV loses
# these: `\with{...}` holds one string per paper, so it records whichever
# institution was written first and silently drops the rest. Checked per paper
# against Crossref/OpenAlex - the TSE 2025 paper really is Bergamo-only, so this
# is not a blanket "add both" rule.
#
# "Mentored coauthor" is `mentored` being non-empty. The CV marks these with $^*$
# and its legend reads: "$^*$ indicates research interns mentored or students I
# served on the PhD Thesis Committee of". Names in `mentored` must also appear in
# `authors` - scripts/check_data.py enforces that, so the two cannot drift.
#
# ---------------------------------------------------------------------------
# STILL UNMODELLED, and visible in the entries below as `note:`
#
# NOT INCLUDED, and needs a decision: "Control for Societal-scale Challenges: Road
# Map 2030" (IEEE CSS, 2023). Its CV annotation reads "several dozen coauthor
# affiliations"; the real number is about 120 named authors, and ieeecss.org
# publishes the names without affiliations. PDF:
# https://ieeecss.org/sites/ieeecss/files/2023-05/CSS_Roadmap_2023_Cover_8x10_FINAL_REV5.pdf
#
# Tagging one entry with ~100 institutions would be worse than leaving it blank.
# `orgs` is read as "institutions I coauthored with", and on a 120-author community
# roadmap that claim does not hold - it would make the entry match nearly every
# org filter, drown out the papers where the collaboration was real, and add ~80
# slugs used exactly once. Scale changes what the facet means. Options: leave orgs
# empty and record the author count instead; or add a `scale: community` marker so
# filters can exclude consensus documents. Not decided, so not entered.
#
# ---------------------------------------------------------------------------
# ONE WORK OR TWO? THE DOI DECIDES.
#
# Papers can appear twice for two completely different reasons, and conflating them
# either inflates the list or hides a real paper. The test is mechanical:
#
#   A SEPARATE DOI IN A SEPARATE VENUE IS A SEPARATE ARTIFACT.
#
#   Distinct DOIs  -> two entries, cross-linked with `related:`. Each counts.
#   No second DOI  -> one entry, second appearance recorded in `also_appeared:`.
#                     Does not count again.
#
# Worked both ways from the actual records rather than from memory:
#
#   L-CSS 2021 + ACC 2021 (the traffic-lights paper) has TWO DOIs -
#   10.1109/LCSYS.2020.3047332 (journal-article) and
#   10.23919/ACC50511.2021.9483298 (proceedings-article). Two entries.
#
#   TSE 2024 + FSE 2024 Journal First (the Simulink testing paper) has ONE DOI.
#   Crossref has no FSE proceedings record: the Journal First track is a talk slot,
#   not a second publication. One entry, `also_appeared`.
#
# The CV gets the first case wrong in the safe direction and the site gets it wrong
# in the unsafe one. The CV folds L-CSS and ACC into a single item whose prose says
# "Also presented at the American Control Conference (ACC) 2021" - and both DOIs are
# sitting in publications.tex COMMENTED OUT, because there was nowhere to put a
# second one. Both site pages list it twice, which is why index.md reaches P29 while
# the CV stops at P28. Same three sources, three different publication counts.
#
# The mechanical test is preferred over "is it really the same paper" precisely
# because that judgement can be answered differently by two copies of a CV, and was.
#
# ---------------------------------------------------------------------------
# WHY `id` EXISTS: P-NUMBERS ARE NOT IDENTITY
#
# The CV's P-numbers are positional and reverse-ordered, so they cannot name a
# paper: the CV tops out at P28, index.md at P29, and publications.md skips P7
# outright. "P6" is not a fact about a paper. `id` is a stable slug, and it is what
# `related:` points at and what permalinks will use.
#
# ---------------------------------------------------------------------------
# THE SAME-TITLE HAZARD
#
# P6 (ICCAD 2011) and P11 (CACM 2013) have the same title AND the same six authors,
# but different content - the CACM Research Highlight is a rewrite for a general
# audience. They are two works and count as two. Keeping them separate creates a new
# way to drift, though: one copy can gain a topic or an institution while its twin
# does not, and because the titles match nobody notices. scripts/check_data.py now
# warns when two entries share a title and disagree on authors/orgs/topics, or share
# warns when two entries share a title and disagree on authors/orgs/topics, or share
# a title without a `related:` link naming the twin. It found this pair unprompted.
#
# ---------------------------------------------------------------------------
# WRITE EACH RELATION ONCE, IN ONE DIRECTION
#
# `related:` is authored on ONE of the two entries - by convention the later or
# derivative one, pointing back. The renderer shows the inverse on the far side
# (revises/revised-as, extends/extended-by, presented-as/presented-at, and the
# symmetric companion), so the reverse must NOT be written out.
#
# This is not a style preference. The first draft of these three links wrote both
# halves, and two copies of one fact are free to disagree - which is the failure this
# whole data model exists to stop. check_data.py now rejects a relation declared from
# both sides, so the rule holds without anyone remembering it.
#
# ---------------------------------------------------------------------------
# STILL OPEN: `kind:` (FULL PAPER vs TOOL PAPER vs ABSTRACT)
#
# Nothing here records weight. The FAC/CAV 2011 entry is a two-page extended abstract
# whose PDF still asks for "oral or poster presentation"; the TSE articles are full
# journal papers. The CV once kept them apart under an `Abstracts` heading, now
# commented out at publications.tex:141, and promoted its six members into the main
# list unchanged - so an abstract and a journal article currently count the same.
# Flagged, not decided: it changes what every publication count on the site means.

required: [id, category, title, authors, venue, year, topics]

