# Panel appearances and panel-organized discussions.
#
# Kept separate from service.yml on purpose. A program-committee role or advisory
# seat is a service fact; a panel appearance is a speaking/visibility artifact with
# its own title, venue and links. Mixing the two would make "show me talks/panels on
# formal methods" impossible without dragging service roles into the same list.
#
# This file is intentionally flat: unlike service entries, panels are not grouped by
# role. The page scans newest-first, and the useful filters are topic plus free-text
# search over the title and venue.

required: [id, what, venue, start, end, topics]

entries:
  - id: ersa-rtss-2025-panel
    what: Explainability of Real-Time Systems and Their Analysis (ERSA)
    venue: 4th International Workshop on Explainability of Real-time Systems and their Analysis at the IEEE Real-Time Systems Symposium (RTSS 2025), Boston, MA, USA
    start: 2025
    end: 2025
    topics: [real-time, ai]
    note: Panel discussion at the ERSA workshop co-located with RTSS 2025.

