# Speaking appearances other than panels.
#
# Panels stay in panels.yml because they are a distinct artifact type in the data
# model, but the user-facing talks page can still render them alongside keynotes
# and invited talks. The split is for source clarity, not to force separate pages.

required: [id, category, what, venue, start, end, topics]

categories:
  - slug: keynote
    name: Keynote Talks
  - slug: invited
    name: Invited Talks
  - slug: tutorial
    name: Tutorials

